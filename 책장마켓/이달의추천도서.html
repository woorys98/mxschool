```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책장마켓</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
            color: #3f342c;
            background: #f7f2e9;
        }

        /* 상단 메뉴 */
        .top-menu {
            width: 100%;
            padding: 20px 30px;
            background: #ebe2d5;
            border-bottom: 1px solid #d8ccbe;
        }

        .top-menu nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-menu a {
            display: inline-block;
            padding: 9px 16px;
            color: #55463b;
            text-decoration: none;
            font-size: 14px;
            border-radius: 20px;
            transition: background-color 0.2s ease;
        }

        .top-menu a:hover {
            background: #dcd0c1;
        }

        /* 헤더 */
        header {
            text-align: center;
            padding: 85px 20px 40px;
        }

        header h1 {
            margin: 0 0 18px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 8vw, 72px);
            font-weight: 700;
            letter-spacing: -2px;
            color: #49382d;
        }

        header p {
            margin: 0;
            font-size: clamp(15px, 2vw, 18px);
            color: #75675c;
            line-height: 1.8;
        }

        /* 추천도서 링크 */
        .recommend-menu {
            text-align: center;
            padding: 25px 20px 60px;
        }

        .recommend-menu a {
            display: inline-block;
            padding: 14px 26px;
            border: 1px solid #c9b9a7;
            border-radius: 30px;
            color: #55463b;
            background: #fffdf9;
            text-decoration: none;
            font-size: 15px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .recommend-menu a:hover {
            background: #eee5d8;
            transform: translateY(-2px);
        }

        /* 메인 */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0 20px 60px;
        }

        .intro {
            width: 100%;
            max-width: 680px;
            padding: 42px 30px;
            text-align: center;
            border-top: 1px solid #d8ccbe;
            border-bottom: 1px solid #d8ccbe;
        }

        .intro p {
            margin: 0;
            line-height: 2;
            font-size: 16px;
            color: #66584d;
        }

        /* 푸터 */
        footer {
            padding: 28px 20px;
            text-align: center;
            background: #ebe2d5;
            color: #75675c;
            font-size: 13px;
            line-height: 1.8;
        }

        footer p {
            margin: 3px 0;
        }

        /* 모바일 */
        @media (max-width: 600px) {
            .top-menu {
                padding: 15px 18px;
            }

            .top-menu nav {
                gap: 4px;
            }

            .top-menu a {
                padding: 8px 12px;
                font-size: 13px;
            }

            header {
                padding: 60px 20px 30px;
            }

            .recommend-menu {
                padding-bottom: 45px;
            }

            .intro {
                padding: 32px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- 상단 좌측 메뉴 -->
    <div class="top-menu">
        <nav aria-label="상단 메뉴">
            <a href="index.html">메인페이지</a>
            <a href="about.html">책장마켓 소개</a>
        </nav>
    </div>

    <!-- 헤더 -->
    <header>
        <h1>책장마켓</h1>
        <p>새로운 주인을 기다리는 책을 만나는 중고서적 마켓</p>
    </header>

    <!-- 이달의 추천도서 -->
    <div class="recommend-menu">
        <a href="recommended.html">이달의 추천도서</a>
    </div>

    <!-- 메인 내용 -->
    <main>
        <section class="intro">
            <p>
                책장마켓은 오래된 책에 새로운 가치를 더하고<br>
                다시 읽고 싶은 책을 편안하게 만날 수 있는<br>
                따뜻한 중고서적 판매점입니다.
            </p>
        </section>
    </main>

    <!-- 하단 정보 -->
    <footer>
        <p>주소: 서울특별시 책마을로 123, 책장마켓</p>
        <p>전화: 02-1234-5678</p>
        <p>대표: 김책장</p>
        <p>© <span id="year"></span> 책장마켓</p>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>
</html>
```
