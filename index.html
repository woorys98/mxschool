<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고양이 놀이터</title>
<style>
  :root{
    --cream:#f7efe1;
    --beige:#eaddc4;
    --floor:#e4d3ae;
    --wall:#f2e6cf;
    --accent-green:#c7d8b8;
    --accent-pink:#f4c9c1;
    --ink:#5a4632;
    --shadow: rgba(90,70,50,0.25);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:"Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background:var(--wall);
    color:var(--ink);
  }

  /* ---------- 배경 ---------- */
  #scene{
    position:relative;
    width:100vw;
    height:100vh;
    background:
      linear-gradient(var(--wall), var(--wall) 68%, var(--floor) 68%, var(--floor) 100%);
    overflow:hidden;
    touch-action:none;
  }
  .rug{
    position:absolute;
    left:50%; top:74%;
    width:min(60vw,520px); height:min(30vw,220px);
    transform:translate(-50%,-50%);
    background:var(--accent-pink);
    border-radius:50%;
    opacity:0.55;
  }
  .window{
    position:absolute; top:6%; left:6%;
    width:16%; max-width:150px; aspect-ratio:1/1.2;
    background:linear-gradient(#d9ecff,#bfe0ff);
    border:8px solid #d8c39c;
    border-radius:10px;
    box-shadow:0 6px 10px var(--shadow);
  }
  .window::before, .window::after{
    content:""; position:absolute; background:#d8c39c;
  }
  .window::before{ left:50%; top:0; width:8px; height:100%; transform:translateX(-50%);}
  .window::after{ top:50%; left:0; height:8px; width:100%; transform:translateY(-50%);}

  /* ---------- 가구/장난감 ---------- */
  .prop{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 4px 3px var(--shadow));
    user-select:none;
    z-index:2;
  }
  .prop-label{
    position:absolute; bottom:-18px; font-size:10px; color:var(--ink); opacity:0.55;
    white-space:nowrap; left:50%; transform:translateX(-50%);
  }
  .cat-tower{
    width:70px; height:150px;
  }
  .tower-post{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:22px; height:130px; background:#cdb691; border-radius:6px;}
  .tower-plat{ position:absolute; width:70px; height:16px; background:#b98a63; border-radius:8px; left:0;}
  .tower-plat.p1{ bottom:0;}
  .tower-plat.p2{ bottom:60px;}
  .tower-plat.p3{ bottom:120px;}

  .box-toy{ width:64px; height:50px; background:#d8b98a; border:3px solid #a9805a; border-radius:4px; position:relative;}
  .box-toy::before{ content:""; position:absolute; top:-3px; left:-3px; right:-3px; height:10px; background:#c49f6f; border-radius:4px 4px 0 0;}

  .cushion{ width:70px; height:44px; border-radius:50%; background:var(--accent-green); box-shadow: inset 0 -6px 8px rgba(0,0,0,0.08);}
  .cushion.pink{ background:var(--accent-pink); }

  .scratcher{ width:34px; height:80px; background:repeating-linear-gradient(0deg,#c9a06a 0 6px,#b98a55 6px 12px); border-radius:6px; border:3px solid #9c7146;}

  .bowl{ width:40px; height:22px; border-radius:0 0 50% 50%/0 0 60% 60%; position:relative;}
  .bowl.water{ background:#a9cbe8; border:3px solid #7fa9cf;}
  .bowl.food{ background:#e3b98a; border:3px solid #b98a55;}

  .ball{
    width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffd9e6, #f08bab 70%);
    box-shadow:0 3px 3px var(--shadow);
    transition: left 0.4s ease, top 0.4s ease;
    z-index:3;
  }

  /* ---------- 고양이 ---------- */
  .cat{
    position:absolute;
    width:56px; height:40px;
    cursor:pointer;
    z-index:5;
    transform-origin:center bottom;
  }
  .cat-inner{
    position:relative; width:100%; height:100%;
    transition: transform 0.15s ease;
  }
  .cat.facing-left .cat-inner{ transform:scaleX(-1); }

  .cat-tail{
    position:absolute; right:-14px; bottom:10px;
    width:26px; height:9px;
    background:var(--cat-main, #e0a458);
    border-radius:8px;
    transform-origin:left center;
    animation: tailwag 1.4s ease-in-out infinite;
  }
  @keyframes tailwag{
    0%,100%{ transform:rotate(10deg); }
    50%{ transform:rotate(-12deg); }
  }

  .cat-body{
    position:absolute; left:6px; bottom:0;
    width:38px; height:22px;
    background:var(--cat-main, #e0a458);
    border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  }
  .cat-head{
    position:absolute; left:0; bottom:14px;
    width:26px; height:22px;
    background:var(--cat-main, #e0a458);
    border-radius:50%;
  }
  .cat-ear{
    position:absolute; top:-7px; width:0; height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-bottom:11px solid var(--cat-main, #e0a458);
  }
  .cat-ear.left{ left:1px; transform:rotate(-8deg);}
  .cat-ear.right{ left:14px; transform:rotate(8deg);}
  .cat-eye{
    position:absolute; top:9px; width:3px; height:3px;
    background:#3a2c20; border-radius:50%;
  }
  .cat-eye.l{ left:6px;}
  .cat-eye.r{ left:15px;}
  .cat-nose{
    position:absolute; top:13px; left:11px;
    width:3px; height:2px; background:#c47a7a; border-radius:50%;
  }
  .cat-pattern{
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  }

  /* 무늬: 얼룩(치즈/고등어) */
  .pattern-cheese .cat-body::after,
  .pattern-cheese .cat-head::after{
    content:""; position:absolute; inset:0; border-radius:inherit;
    background:
      radial-gradient(circle at 30% 70%, #c97f2e 0 30%, transparent 32%),
      radial-gradient(circle at 70% 30%, #c97f2e 0 25%, transparent 27%);
  }
  .pattern-tabby .cat-body::after,
  .pattern-tabby .cat-head::after{
    content:""; position:absolute; inset:0; border-radius:inherit;
    background: repeating-linear-gradient(100deg, rgba(70,55,40,0.35) 0 3px, transparent 3px 9px);
  }
  .pattern-calico .cat-body::after,
  .pattern-calico .cat-head::after{
    content:""; position:absolute; inset:0; border-radius:inherit;
    background:
      radial-gradient(circle at 25% 30%, #3a2c20 0 22%, transparent 24%),
      radial-gradient(circle at 75% 60%, #d97757 0 26%, transparent 28%);
  }
  .pattern-plain .cat-body::after,
  .pattern-plain .cat-head::after{ content:none; }

  /* 상태 표현 */
  .cat.state-sleeping .cat-inner{ transform:translateY(4px) rotate(0deg); }
  .cat.state-sleeping .cat-eye{ height:1px; top:10px; background:#3a2c20; border-radius:1px;}
  .cat.state-sleeping .cat-body{ height:16px; bottom:2px; }
  .cat.state-sleeping .cat-tail{ animation:none; transform:rotate(0deg);}
  .zzz{
    position:absolute; top:-16px; left:18px; font-size:11px; opacity:0.8;
    animation: floatzzz 2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes floatzzz{
    0%{ opacity:0; transform:translateY(4px);}
    30%{opacity:1;}
    100%{ opacity:0; transform:translateY(-14px);}
  }

  .cat.state-sitting .cat-body{ height:20px; }

  .cat.state-walking .cat-inner{ animation: bob 0.5s ease-in-out infinite; }
  .cat.state-running .cat-inner{ animation: bob 0.22s ease-in-out infinite; }
  .cat.state-playing .cat-inner{ animation: pounce 0.5s ease-in-out infinite; }
  @keyframes bob{
    0%,100%{ transform:translateY(0);}
    50%{ transform:translateY(-3px);}
  }
  @keyframes pounce{
    0%,100%{ transform:translateY(0) rotate(0deg);}
    50%{ transform:translateY(-6px) rotate(-6deg);}
  }
  .cat.facing-left.state-walking .cat-inner,
  .cat.facing-left.state-running .cat-inner,
  .cat.facing-left.state-playing .cat-inner{
    animation-name: bobLeft;
  }
  @keyframes bobLeft{
    0%,100%{ transform:scaleX(-1) translateY(0);}
    50%{ transform:scaleX(-1) translateY(-3px);}
  }

  .bubble{
    position:absolute; top:-26px; left:50%; transform:translateX(-50%);
    background:#fff; border:2px solid var(--ink); border-radius:10px;
    padding:2px 7px; font-size:11px; white-space:nowrap;
    animation: popfade 1.1s ease forwards;
    pointer-events:none;
    z-index:20;
  }
  @keyframes popfade{
    0%{ opacity:0; transform:translate(-50%,6px) scale(0.7);}
    15%{ opacity:1; transform:translate(-50%,0) scale(1);}
    80%{ opacity:1;}
    100%{ opacity:0; transform:translate(-50%,-8px) scale(0.9);}
  }

  /* ---------- UI ---------- */
  #ui{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; align-items:center;
    background:rgba(255,255,255,0.7);
    padding:8px 16px; border-radius:20px;
    box-shadow:0 4px 10px var(--shadow);
    z-index:50;
    backdrop-filter: blur(2px);
  }
  #addCatBtn{
    border:none; background:var(--accent-pink); color:var(--ink);
    padding:8px 16px; border-radius:16px; font-size:14px;
    cursor:pointer; font-weight:600;
    transition: transform 0.12s ease, background 0.2s ease;
  }
  #addCatBtn:hover{ background:#f0aca0; }
  #addCatBtn:active{ transform:scale(0.94); }
  #catCount{
    font-size:14px; font-weight:600; color:var(--ink);
  }
  h1#title{
    position:absolute; top:14px; left:16px;
    margin:0; font-size:16px; font-weight:700; color:var(--ink);
    opacity:0.75; z-index:50;
  }

  @media (max-width:600px){
    #title{ display:none; }
    #ui{ padding:6px 10px; gap:6px; top:8px;}
    #addCatBtn{ padding:6px 11px; font-size:12px;}
    #catCount{ font-size:12px;}
  }
</style>
</head>
<body>

<h1 id="title">🐾 고양이 놀이터</h1>
<div id="ui">
  <button id="addCatBtn">고양이 추가</button>
  <span id="catCount">현재 고양이 : 0마리</span>
</div>

<div id="scene">
  <div class="window"></div>
  <div class="rug"></div>
</div>

<script>
/* =========================================================
   고양이 놀이터 - 순수 HTML/CSS/JS 구현
   ========================================================= */

const scene = document.getElementById('scene');
const catCountLabel = document.getElementById('catCount');
const addCatBtn = document.getElementById('addCatBtn');

// 고양이 품종별 색상 & 무늬 클래스
const BREEDS = [
  { main: '#e3a85c', pattern: 'pattern-cheese' },   // 치즈 고양이
  { main: '#3a3a3a', pattern: 'pattern-plain'  },   // 검은 고양이
  { main: '#f5efe3', pattern: 'pattern-plain'  },   // 흰 고양이
  { main: '#b7a98f', pattern: 'pattern-tabby'  },   // 고등어 태비
  { main: '#e8ded0', pattern: 'pattern-calico' }    // 삼색 고양이
];

const STATES = ['walking', 'sitting', 'sleeping', 'running', 'playing', 'following'];

let cats = [];
let toys = [];   // 장난감(공, 캣타워 등)의 위치 정보
let catIdSeq = 0;
let mouseX = null, mouseY = null;

// ---------- 유틸 ----------
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function sceneBounds() {
  return { w: scene.clientWidth, h: scene.clientHeight };
}

// ---------- 배경 소품 배치 ----------
function placeProps() {
  const layout = [
    { cls: 'cat-tower', left: '4%',  top: '46%', label: '캣타워',
      inner: '<div class="tower-post"></div><div class="tower-plat p1"></div><div class="tower-plat p2"></div><div class="tower-plat p3"></div>' },
    { cls: 'box-toy', left: '82%', top: '54%', label: '박스' },
    { cls: 'cushion', left: '30%', top: '80%', label: '쿠션' },
    { cls: 'cushion pink', left: '66%', top: '82%', label: '쿠션' },
    { cls: 'scratcher', left: '90%', top: '70%', label: '스크래처' },
    { cls: 'bowl water', left: '10%', top: '86%', label: '물그릇' },
    { cls: 'bowl food', left: '18%', top: '86%', label: '사료그릇' }
  ];

  layout.forEach(item => {
    const el = document.createElement('div');
    el.className = 'prop ' + item.cls.split(' ')[0];
    if (item.cls.includes(' ')) el.classList.add(item.cls.split(' ')[1]);
    el.style.left = item.left;
    el.style.top = item.top;
    if (item.inner) el.innerHTML = item.inner;
    const label = document.createElement('div');
    label.className = 'prop-label';
    label.textContent = item.label;
    el.appendChild(label);
    scene.appendChild(el);

    // 장난감으로 인식할 요소는 toys 배열에 등록 (고양이가 근처에서 반응)
    toys.push({ el, type: item.label });
  });

  // 장난감 공 2개는 별도로 살짝 움직일 수 있게 관리
  ['46%,88%', '58%,60%'].forEach(pos => {
    const [l, t] = pos.split(',');
    const ball = document.createElement('div');
    ball.className = 'ball prop';
    ball.style.left = l;
    ball.style.top = t;
    scene.appendChild(ball);
    toys.push({ el: ball, type: '장난감 공', isBall: true });
  });
}

// ---------- 고양이 생성 ----------
function createCat(x, y) {
  const breed = BREEDS[randInt(0, BREEDS.length - 1)];
  const { w, h } = sceneBounds();

  const cat = {
    id: catIdSeq++,
    x: x !== undefined ? x : rand(40, w - 40),
    y: y !== undefined ? y : rand(h * 0.35, h - 60),
    speed: rand(0.4, 1.3),
    direction: 1, // 1: 오른쪽, -1: 왼쪽
    state: 'sitting',
    targetX: null,
    targetY: null,
    followsMouse: Math.random() < 0.35,
    followTarget: null,
    stateTimer: 0,
    stateDuration: rand(2000, 5000),
    el: null
  };

  const el = document.createElement('div');
  el.className = 'cat state-sitting ' + breed.pattern;
  el.style.setProperty('--cat-main', breed.main);
  el.style.left = cat.x + 'px';
  el.style.top = cat.y + 'px';
  el.innerHTML = `
    <div class="cat-inner">
      <div class="cat-tail"></div>
      <div class="cat-body"></div>
      <div class="cat-head">
        <div class="cat-ear left"></div>
        <div class="cat-ear right"></div>
        <div class="cat-eye l"></div>
        <div class="cat-eye r"></div>
        <div class="cat-nose"></div>
      </div>
    </div>
  `;
  el.addEventListener('click', (e) => { e.stopPropagation(); handleCatClick(cat); });
  scene.appendChild(el);

  cat.el = el;
  cats.push(cat);
  updateCatCount();
  pickNewTarget(cat);
  return cat;
}

function spawnCat() {
  const { w, h } = sceneBounds();
  createCat(rand(40, w - 40), rand(h * 0.35, h - 60));
}

function updateCatCount() {
  catCountLabel.textContent = `현재 고양이 : ${cats.length}마리`;
}

// ---------- 상태 변경 ----------
function changeCatState(cat, newState) {
  cat.el.classList.remove('state-' + cat.state);
  cat.state = newState;
  cat.el.classList.add('state-' + cat.state);
  cat.stateTimer = 0;
  cat.stateDuration = rand(1800, 5000);

  // 상태별 초기 설정
  if (newState === 'sleeping') {
    removeZzz(cat);
    const zzz = document.createElement('div');
    zzz.className = 'zzz';
    zzz.textContent = '💤';
    zzz.dataset.zzz = '1';
    cat.el.appendChild(잘자);
  } else {
    removeZzz(cat);
  }

  if (newState === 'walking' || newState === 'running') {
    pickNewTarget(cat);
  }

  if (newState === 'following') {
    const others = cats.filter(c => c.id !== cat.id);
    cat.followTarget = others.length ? others[randInt(0, others.length - 1)] : null;
    if (!cat.followTarget) changeCatState(cat, 'walking');
  }
}

function removeZzz(cat) {
  const existing = cat.el.querySelector('.zzz');
  if (existing) existing.remove();
}

function pickNewTarget(cat) {
  const { w, h } = sceneBounds();
  cat.targetX = clamp(rand(20, w - 60), 20, w - 60);
  cat.targetY = clamp(rand(h * 0.32, h - 60), h * 0.32, h - 60);
}

// 랜덤하게 다음 행동 결정 (자연스러운 확률 분포)
function pickRandomBehavior(cat) {
  const roll = Math.random();
  if (roll < 0.28) return 'walking';
  if (roll < 0.40) return 'running';
  if (roll < 0.55) return 'sitting';
  if (roll < 0.70) return 'sleeping';
  if (roll < 0.85) return 'playing';
  return 'following';
}

// ---------- 클릭 반응 ----------
function handleCatClick(cat) {
  const reactions = ['meow', 'heart', 'jump', 'flee', 'freeze'];
  const reaction = reactions[randInt(0, reactions.length - 1)];

  switch (reaction) {
    case 'meow':
      showBubble(cat, '야옹!');
      break;
    case 'heart':
      showBubble(cat, '❤️');
      break;
    case 'jump':
      changeCatState(cat, 'playing');
      break;
    case 'flee': {
      const { w, h } = sceneBounds();
      cat.targetX = clamp(rand(20, w - 60), 20, w - 60);
      cat.targetY = clamp(rand(h * 0.32, h - 60), h * 0.32, h - 60);
      cat.speed = rand(1.8, 2.6);
      changeCatState(cat, 'running');
      break;
    }
    case 'freeze':
      changeCatState(cat, 'sitting');
      break;
  }
}

function showBubble(cat, text) {
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  cat.el.appendChild(풍선껌);
  setTimeout(() => bubble.remove(), 1100);
}

// ---------- 장난감 상호작용 ----------
function checkToyInteraction(cat) {
  if (cat.state === 'sleeping' || cat.state === 'following') return;
  for (const toy of toys) {
    const rect = toy.el.getBoundingClientRect();
    const sceneRect = scene.getBoundingClientRect();
    const toyX = rect.left - sceneRect.left + rect.width / 2;
    const toyY = rect.top - sceneRect.top + rect.height / 2;
    const dist = Math.hypot(cat.x - toyX, cat.y - toyY);
    if (dist < 30 && cat.state !== 'playing' && Math.random() < 0.01) {
      changeCatState(cat, 'playing');
      if (toy.isBall) {
        // 공을 살짝 밀어내는 듯한 연출
        const { w, h } = sceneBounds();
        toy.el.style.left = clamp(toyX + rand(-40, 40), 10, w - 30) + 'px';
        toy.el.style.top = clamp(toyY + rand(-30, 30), 10, h - 30) + 'px';
      }
      break;
    }
  }
}

// ---------- 이동 처리 ----------
function moveCat(cat, dt) {
  const { w, h } = sceneBounds();

  if (cat.state === 'walking' || cat.state === 'running' || cat.state === 'following') {
    let tx = cat.targetX, ty = cat.targetY;

    if (cat.state === 'following' && cat.followTarget) {
      tx = cat.followTarget.x - 20;
      ty = cat.followTarget.y;
    } else if (cat.followsMouse && mouseX !== null && cat.state === 'walking' && Math.random() < 0.02) {
      tx = mouseX;
      ty = mouseY;
    }

    if (tx === null || ty === null) { pickNewTarget(cat); return; }

    const dx = tx - cat.x;
    const dy = ty - cat.y;
    const dist = Math.hypot(dx, dy);

    if (dist < 6) {
      pickNewTarget(cat);
    } else {
      const spd = (cat.state === 'running' ? cat.speed * 2.1 : cat.speed) * dt * 0.06;
      cat.x += (dx / dist) * spd;
      cat.y += (dy / dist) * spd;
      cat.direction = dx >= 0 ? 1 : -1;
    }
  }

  // 화면 밖으로 나가지 않도록 경계 처리
  cat.x = clamp(cat.x, 10, w - 46);
  cat.y = clamp(cat.y, h * 0.30, h - 46);

  cat.el.style.left = cat.x + 'px';
  cat.el.style.top = cat.y + 'px';
  cat.el.classList.toggle('facing-left', cat.direction === -1);
}

// ---------- 전체 갱신 ----------
function updateCats(dt) {
  cats.forEach(cat => {
    cat.stateTimer += dt;
    if (cat.stateTimer > cat.stateDuration) {
      changeCatState(cat, pickRandomBehavior(cat));
    }
    moveCat(cat, dt);
    checkToyInteraction(cat);
  });
}

// ---------- 애니메이션 루프 ----------
let lastTime = performance.now();
function animate(now) {
  const dt = Math.min(now - lastTime, 60);
  lastTime = now;
  updateCats(dt);
  requestAnimationFrame(animate);
}

// ---------- 이벤트 ----------
addCatBtn.addEventListener('click', spawnCat);

scene.addEventListener('mousemove', (e) => {
  const rect = scene.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});
scene.addEventListener('mouseleave', () => { mouseX = null; mouseY = null; });
scene.addEventListener('touchmove', (e) => {
  if (e.touches && e.touches[0]) {
    const rect = scene.getBoundingClientRect();
    mouseX = e.touches[0].clientX - rect.left;
    mouseY = e.touches[0].clientY - rect.top;
  }
}, { passive: true });

window.addEventListener('resize', () => {
  const { w, h } = sceneBounds();
  cats.forEach(cat => {
    cat.x = clamp(cat.x, 10, w - 46);
    cat.y = clamp(cat.y, h * 0.30, h - 46);
  });
});

// ---------- 초기화 ----------
function init() {
  placeProps();
  const startCount = 5;
  for (let i = 0; i < startCount; i++) spawnCat();
  requestAnimationFrame(animate);
}

init();
</script>
</body>
