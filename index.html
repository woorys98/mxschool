<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책장마켓</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
            color: #3f342c;
            background: #f7f2e9;
        }

        header {
            text-align: center;
            padding: 90px 20px 40px;
        }

        header h1 {
            margin: 0 0 18px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 8vw, 72px);
            font-weight: 700;
            letter-spacing: -2px;
            color: #49382d;
        }

        header p {
            margin: 0;
            font-size: clamp(15px, 2vw, 18px);
            color: #75675c;
            line-height: 1.8;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 25px 20px 70px;
        }

        nav a {
            display: inline-block;
            padding: 14px 24px;
            border: 1px solid #c9b9a7;
            border-radius: 30px;
            color: #55463b;
            background: #fffdf9;
            text-decoration: none;
            font-size: 15px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        nav a:hover {
            background: #eee5d8;
            transform: translateY(-2px);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0 20px 60px;
        }

        .intro {
            width: 100%;
            max-width: 680px;
            padding: 42px 30px;
            text-align: center;
            border-top: 1px solid #d8ccbe;
            border-bottom: 1px solid #d8ccbe;
        }

        .intro p {
            margin: 0;
            line-height: 2;
            font-size: 16px;
            color: #66584d;
        }

        footer {
            padding: 28px 20px;
            text-align: center;
            background: #ebe2d5;
            color: #75675c;
            font-size: 13px;
            line-height: 1.8;
        }

        footer p {
            margin: 3px 0;
        }

        @media (max-width: 600px) {
            header {
                padding: 65px 20px 30px;
            }

            nav {
                flex-direction: column;
                align-items: center;
                gap: 10px;
                padding-bottom: 50px;
            }

            nav a {
                width: min(100%, 280px);
                text-align: center;
            }

            .intro {
                padding: 32px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>책장마켓</h1>
        <p>새로운 주인을 기다리는 책을 만나는 중고서적 마켓</p>
    </header>

    <nav aria-label="주요 메뉴">
        <a href="이달의추천도서.html">이달의 추천도서</a>
        <a href="책장마켓소개.html">책장마켓 소개</a>
    </nav>

    <main>
        <section class="intro">
            <p>
                책장마켓은 오래된 책에 새로운 가치를 더하고<br>
                다시 읽고 싶은 책을 편안하게 만날 수 있는<br>
                따뜻한 중고서적 판매점입니다.
            </p>
        </section>
    </main>

    <footer>
        <p>주소: 서울특별시 책마을로 123, 책장마켓</p>
        <p>전화: 02-1234-5678</p>
        <p>대표: 김책장</p>
        <p>© <span id="year"></span> 책장마켓</p>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>
</html>
